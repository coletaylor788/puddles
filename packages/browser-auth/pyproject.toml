[project]
name = "puddles-browser-auth"
version = "0.1.0"
description = "Private host browser sessions for authenticated HTTP integrations"
requires-python = ">=3.11"
dependencies = ["playwright==1.63.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/puddles_browser_auth"]
