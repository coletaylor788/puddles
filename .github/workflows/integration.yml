name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cumulative:
    # Standard Intel runners have 14 GB RAM; macos-latest has only 7 GB.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      E2E_RUN_DIR: ${{ runner.temp }}/puddles-public-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LOCAL_EXTENSION: ""
    steps:
      - name: Check out Puddles
        uses: actions/checkout@v4

      - name: Check out pinned OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
          path: .openclaw-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable package managers
        run: corepack enable

      - name: Install Puddles dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Gmail test dependencies
        run: python -m pip install -e './servers/gmail-mcp[dev]'

      - name: Initialize public run evidence
        run: node packages/e2e/bin/public-ci-diagnostics.mjs init

      - name: Run cumulative integration lifecycle
        id: cumulative
        env:
          OPENCLAW_SRC: ${{ github.workspace }}/.openclaw-source
        run: node packages/e2e/bin/openclaw-test-env.mjs ci

      - name: Collect public failure evidence
        id: public-diagnostics
        if: failure() && steps.cumulative.outcome == 'failure'
        run: node packages/e2e/bin/public-ci-diagnostics.mjs collect

      - name: Retain sanitized public failure evidence
        if: failure() && steps.public-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-native-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/puddles-public-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
