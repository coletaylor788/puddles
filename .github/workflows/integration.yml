name: Integration

on:
  workflow_dispatch:
  pull_request:
    # Only human-facing docs; runtime prompts, patches, and CI changes still run.
    paths-ignore:
      - "packages/release/**"
      - ".github/workflows/release.yml"
      - "docs/openclaw-setup/patches/apply-and-deploy.sh"
      - "**/README.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/skills/**/*.md"
      - "docs/plans/**/*.md"
      - "docs/openclaw-setup/*.md"
      - "docs/openclaw-setup/patches/*.md"
      - "docs/openclaw-setup/apple-pim/*.md"
      - "packages/*/docs/**/*.md"
      - "packages/e2e/DEVELOPMENT_STORAGE.md"
      - "packages/e2e/DEPLOYMENT_COORDINATION.md"
      - "servers/*/docs/**/*.md"
      - "servers/*/brainstorming/**/*.md"
  push:
    branches: [main]
    # Only human-facing docs; runtime prompts, patches, and CI changes still run.
    paths-ignore:
      - "packages/release/**"
      - ".github/workflows/release.yml"
      - "docs/openclaw-setup/patches/apply-and-deploy.sh"
      - "**/README.md"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/skills/**/*.md"
      - "docs/plans/**/*.md"
      - "docs/openclaw-setup/*.md"
      - "docs/openclaw-setup/patches/*.md"
      - "docs/openclaw-setup/apple-pim/*.md"
      - "packages/*/docs/**/*.md"
      - "packages/e2e/DEVELOPMENT_STORAGE.md"
      - "packages/e2e/DEPLOYMENT_COORDINATION.md"
      - "servers/*/docs/**/*.md"
      - "servers/*/brainstorming/**/*.md"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox-media:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out Puddles
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"
      - name: Build and export the sandbox image
        run: node packages/sandbox-tools/build.mjs "$RUNNER_TEMP/sandbox-application"
      - name: Load the packaged image and test installed capabilities
        run: node packages/sandbox-tools/installed.mjs test "$RUNNER_TEMP/sandbox-application"

  repository:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      E2E_LOCAL_EXTENSION: ""
      E2E_RESOURCE_PROFILE: hosted-arm
    steps:
      - name: Check out Puddles
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure package manager store
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TOOL_CACHE/puddles-pnpm-store" >> "$GITHUB_ENV"
      - name: Enable package managers
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          test "$(corepack pnpm --version)" = "12.4.0"
      - name: Install Puddles dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Python service test dependencies
        run: |
          python -m pip install --require-hashes -r servers/rocket-money-mcp/requirements.lock
          python -m pip install -e './servers/gmail-mcp[dev]' -e './packages/browser-auth' -e './servers/rocket-money-mcp[dev]'
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Check repository packages
        run: |
          corepack pnpm build
          corepack pnpm lint
          corepack pnpm test
      - name: Check Gmail
        working-directory: servers/gmail-mcp
        run: |
          python -m pytest tests/ --ignore=tests/integration -q
          python -m ruff check src/ tests/
          python -m compileall -q src tests
          runtime_root=$(mktemp -d)
          trap 'rm -rf "$runtime_root"' EXIT
          python scripts/build-runtime.py --output "$runtime_root/python"
          GMAIL_MCP_PYTHON=$(command -v python) node ../../packages/e2e/scenarios/gmail-runtime.mjs "$runtime_root/python"

      - name: Check Rocket Money and shared browser auth
        run: |
          python -m pytest servers/rocket-money-mcp/tests -q
          python -m ruff check servers/rocket-money-mcp/src servers/rocket-money-mcp/tests packages/browser-auth/src

  cumulative:
    # Dispatch on main pins github.sha once. Later main commits do not replace it.
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Standard public ARM runner. The managed profile measures the complete job.
    runs-on: macos-15
    timeout-minutes: 180
    env:
      E2E_LOCAL_EXTENSION: ""
      E2E_RESOURCE_MEASURE: "1"
      E2E_RESOURCE_PROFILE: hosted-arm
    steps:
      - name: Check out Puddles
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: eb377ac59e6c9fd6c7705028034812becf00271b
          path: .openclaw-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure package manager store
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TOOL_CACHE/puddles-pnpm-store" >> "$GITHUB_ENV"

      - name: Enable package managers
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          test "$(corepack pnpm --version)" = "12.4.0"
          corepack pnpm store path --silent

      - name: Install Puddles dependencies
        run: pnpm install --frozen-lockfile

      - name: Select application test prerequisites
        run: |
          echo "GMAIL_MCP_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'

      - name: Apply the application patch stack
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const suite = JSON.parse(readFileSync('packages/e2e/openclaw-patch-suite.json', 'utf8'));
          for (const patch of suite.patches) execFileSync('git', ['-C', '.openclaw-source', 'apply', `${process.cwd()}/docs/openclaw-setup/patches/${patch.name}.patch`], { stdio: 'inherit' });
          JS
      - name: Install application source dependencies
        run: corepack pnpm -C .openclaw-source install --frozen-lockfile
      - name: Build the application once
        run: |
          corepack pnpm build
          node packages/e2e/bin/build-application.mjs "$GITHUB_WORKSPACE/.openclaw-source" "$GITHUB_WORKSPACE/.application-output"
      - name: Run the full application suite
        env:
          OPENCLAW_SRC: ${{ github.workspace }}/.openclaw-source
          OPENCLAW_CANDIDATE_DIR: ${{ github.workspace }}/.application-output
        run: node packages/e2e/bin/openclaw-test-env.mjs ci
