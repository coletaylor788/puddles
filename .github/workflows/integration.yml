name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cumulative:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out Puddles
        uses: actions/checkout@v4

      - name: Check out pinned OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
          path: .openclaw-source

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable package managers
        run: corepack enable

      - name: Install Puddles dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Gmail test dependencies
        run: python -m pip install -e './servers/gmail-mcp[dev]'

      - name: Run cumulative integration lifecycle
        env:
          OPENCLAW_SRC: ${{ github.workspace }}/.openclaw-source
        run: node packages/e2e/bin/openclaw-test-env.mjs ci
