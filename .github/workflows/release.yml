name: Release tooling
on:
  pull_request:
    paths:
      - 'packages/release/**'
      - '.github/workflows/release.yml'
      - 'docs/openclaw-setup/patches/apply-and-deploy.sh'
  push:
    branches: [main]
    paths:
      - 'packages/release/**'
      - '.github/workflows/release.yml'
      - 'docs/openclaw-setup/patches/apply-and-deploy.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-tool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, puddles-build]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Install pinned package manager
        run: |
          npm install --prefix "$RUNNER_TEMP/puddles-pnpm" --no-save --no-audit --no-fund pnpm@12.4.0
          echo "$RUNNER_TEMP/puddles-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/puddles-pnpm/node_modules/.bin/pnpm" --version)" = 12.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Remove job-owned build outputs
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/packages/release/node_modules" "$GITHUB_WORKSPACE/packages/release/dist" "$RUNNER_TEMP/puddles-pnpm"
