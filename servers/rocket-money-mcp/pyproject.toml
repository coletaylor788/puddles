[project]
name = "rocket-money-mcp"
version = "0.1.0"
description = "Scoped Rocket Money HTTP tools using trusted host browser authentication"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "graphql-core==3.3.0", "jsonschema==4.26.0", "puddles-browser-auth==0.1.0"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
[project.scripts]
rocket-money-mcp = "rocket_money_mcp.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rocket_money_mcp"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
