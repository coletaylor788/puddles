packages:
  - "packages/*"
  - "!packages/release"
  - "openclaw-plugins/*"

# Preserve the existing policy: only esbuild may run an install script.
# pnpm 12 requires every discovered build to be classified explicitly.
allowBuilds:
  agent-browser: false
  "@stripe/link-cli": false
  "@google/genai": false
  esbuild: true
  keytar: false
  koffi: false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  - '@agent-browser/cli-darwin-arm64@0.43.0'
  - '@agent-browser/cli-darwin-x64@0.43.0'
  - '@agent-browser/cli-linux-arm64-gnu@0.43.0'
  - '@agent-browser/cli-linux-arm64-musl@0.43.0'
  - '@agent-browser/cli-linux-x64-gnu@0.43.0'
  - '@agent-browser/cli-linux-x64-musl@0.43.0'
  - '@agent-browser/cli-win32-x64-msvc@0.43.0'
  - agent-browser@0.43.0

overrides:
  "uuid@<14.0.0": ">=14.0.0"
  "protobufjs@<7.5.6": ">=7.5.6"
  "@protobufjs/utf8@<1.1.1": ">=1.1.1"
  "hono@<4.12.18": ">=4.12.18"
  "fast-uri@<3.1.2": ">=3.1.2"
  "fast-xml-builder@<1.1.7": ">=1.1.7"
  "basic-ftp@<5.3.1": ">=5.3.1"
  "ip-address@<10.1.1": ">=10.1.1"
  "@anthropic-ai/sdk@<0.91.1": ">=0.91.1"

patchedDependencies:
  apple-pim-cli@3.7.22: patches/apple-pim-cli@3.7.22.patch
